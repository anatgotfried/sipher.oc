<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#ffffff">
    <meta name="description" content="Agent Cards is a local visual action feed for AI agents.">
    <title>Agent Cards</title>
    <link rel="icon" href="/icon.svg" type="image/svg+xml">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="stylesheet" href="/style.css">
  </head>
  <body>
    <div id="app" class="app-shell">
      <header class="topbar">
        <div class="brand-lockup">
          <span class="brand-mark" aria-hidden="true">
            <img src="/icon.svg" alt="">
          </span>
          <h1>Agent Cards</h1>
        </div>
        <div class="topbar-actions">
          <div id="version-pill" class="version-button" aria-label="Installed version">
            <span id="version-label">v...</span>
            <strong id="version-state">Checking</strong>
          </div>
          <div class="server-pill" title="Local API status">
            <span class="status-dot"></span>
            <span id="api-status">Syncing</span>
          </div>
        </div>
      </header>

      <div id="freshness-banner" class="freshness-banner" hidden>
        <strong id="freshness-title">Stale instance</strong>
        <span id="freshness-copy">Verify the running Agent Cards URL.</span>
      </div>

      <main class="main-grid">
        <aside class="rail" aria-label="Agent Cards sections">
          <button class="nav-item active" data-view="needs-me" type="button">
            <span class="nav-label"><span class="ui-icon" data-icon="inbox"></span>Needs Me</span>
            <strong id="needs-count">0</strong>
          </button>
          <button class="nav-item" data-view="today" type="button">
            <span class="nav-label"><span class="ui-icon" data-icon="calendar"></span>Today</span>
            <strong id="today-count">0</strong>
          </button>
          <button class="nav-item" data-view="projects" type="button">
            <span class="nav-label"><span class="ui-icon" data-icon="folder"></span>Projects</span>
            <strong id="project-count">0</strong>
          </button>
          <button class="nav-item" data-view="archive" type="button">
            <span class="nav-label"><span class="ui-icon" data-icon="archive"></span>Archive</span>
            <strong id="archive-count">0</strong>
          </button>
        </aside>

        <section class="feed-panel" aria-live="polite">
          <div class="feed-header">
            <div>
              <h2 id="view-title">Needs Me</h2>
              <p id="view-subtitle">Cards waiting for a decision, answer, or review.</p>
            </div>
            <div class="toolbar">
              <select id="type-filter" aria-label="Filter by card type">
                <option value="all">All types</option>
                <option value="approval">Approval</option>
                <option value="choice">Choice</option>
                <option value="question">Question</option>
                <option value="status">Status</option>
                <option value="briefing">Briefing</option>
                <option value="comparison">Comparison</option>
              </select>
              <button id="seed-demo" class="ghost-button" type="button">Seed demo</button>
            </div>
          </div>

          <div id="cards" class="cards"></div>
          <div id="empty-state" class="empty-state" hidden>
            <h3>No cards here</h3>
            <p>Create one with the CLI or seed the demo cards.</p>
          </div>
        </section>

        <aside class="detail-panel" aria-label="Selected card details">
          <div id="detail-empty" class="detail-empty">
            <h2>Select a card</h2>
            <p>Review metadata, history, and structured feedback events.</p>
          </div>
          <article id="detail-card" class="detail-card" hidden></article>
        </aside>
      </main>

      <nav class="bottom-nav" aria-label="Primary">
        <button class="bottom-item active" data-view="needs-me" type="button"><span class="ui-icon" data-icon="inbox"></span><span>Needs Me</span></button>
        <button class="bottom-item" data-view="today" type="button"><span class="ui-icon" data-icon="calendar"></span><span>Today</span></button>
        <button class="bottom-item" data-view="projects" type="button"><span class="ui-icon" data-icon="folder"></span><span>Projects</span></button>
        <button class="bottom-item" data-view="archive" type="button"><span class="ui-icon" data-icon="archive"></span><span>Archive</span></button>
      </nav>
    </div>

    <script src="/app.js" type="module"></script>
  </body>
</html>
